server:
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: manta
  profiles:
    default: local
  web:
    resources:
      static-locations:
        - file:./build/api-spec/
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
  jpa:
    open-in-view: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      completion-mode: archive

logging:
  pattern:
    level: 'traceId=%X{traceId:-} %5p'

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  enabled: true
  path: /scalar
  url: /openapi3.yaml

manta:
  auth:
    issuer: ${AUTH_JWT_ISSUER}
    audience: ${AUTH_JWT_AUDIENCE}
    jwt-secret: ${AUTH_JWT_SECRET}
    access-token-ttl: PT30M
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL}
    frontend-login-callback-uri: ${AUTH_FRONTEND_LOGIN_CALLBACK_URI}
    frontend-signup-callback-uri: ${AUTH_FRONTEND_SIGNUP_CALLBACK_URI}
    frontend-error-callback-uri: ${AUTH_FRONTEND_ERROR_CALLBACK_URI}
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
      authorization-uri: ${GOOGLE_OAUTH_AUTHORIZATION_URI}
      token-uri: ${GOOGLE_OAUTH_TOKEN_URI}
      user-info-uri: ${GOOGLE_OAUTH_USER_INFO_URI}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
      authorization-uri: ${KAKAO_OAUTH_AUTHORIZATION_URI}
      token-uri: ${KAKAO_OAUTH_TOKEN_URI}
      user-info-uri: ${KAKAO_OAUTH_USER_INFO_URI}
      redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI}
    naver:
      client-id: ${NAVER_OAUTH_CLIENT_ID}
      client-secret: ${NAVER_OAUTH_CLIENT_SECRET}
      authorization-uri: ${NAVER_OAUTH_AUTHORIZATION_URI}
      token-uri: ${NAVER_OAUTH_TOKEN_URI}
      user-info-uri: ${NAVER_OAUTH_USER_INFO_URI}
      redirect-uri: ${NAVER_OAUTH_REDIRECT_URI}
