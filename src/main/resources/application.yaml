spring:
  application:
    name: manta
  profiles:
    default: local
  web:
    resources:
      static-locations:
        - file:./build/api-spec/
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
  jpa:
    open-in-view: false
  modulith:
    detection-strategy: explicitly-annotated
    events:
      completion-mode: archive

logging:
  pattern:
    level: 'traceId=%X{traceId:-} %5p'

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

scalar:
  enabled: false
  path: /scalar
  url: /openapi3.yaml

manta:
  auth:
    issuer: ${AUTH_JWT_ISSUER:http://localhost:8080}
    audience: ${AUTH_JWT_AUDIENCE:manta-api}
    jwt-secret: ${AUTH_JWT_SECRET}
    access-token-ttl: PT30M
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:manta_refresh_token}
    oauth-state-cookie-name: ${AUTH_OAUTH_STATE_COOKIE_NAME:manta_oauth_state}
    oauth-verifier-cookie-name: ${AUTH_OAUTH_VERIFIER_COOKIE_NAME:manta_oauth_verifier}
    frontend-callback-uri: ${AUTH_FRONTEND_CALLBACK_URI:http://localhost:3000/auth/callback}
    oauth-authorization-ttl: ${AUTH_OAUTH_AUTHORIZATION_TTL:PT10M}
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${GOOGLE_OAUTH_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${GOOGLE_OAUTH_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${KAKAO_OAUTH_AUTHORIZATION_URI:https://kauth.kakao.com/oauth/authorize}
      token-uri: ${KAKAO_OAUTH_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_OAUTH_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
      redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/kakao/callback}
