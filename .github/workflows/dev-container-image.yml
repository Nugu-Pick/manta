name: dev container image

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 확인
        uses: actions/checkout@v5

      - name: Java 25 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: REST Docs 기반 OpenAPI 생성
        run: ./gradlew clean openapi3 --no-daemon --console=plain

      - name: GitHub Container Registry 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 개발 이미지 build 및 publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nugu-pick/manta-dev:dev
            ghcr.io/nugu-pick/manta-dev:${{ github.sha }}
